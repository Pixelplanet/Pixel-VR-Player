name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (leave empty for a build-only run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Steam Frame ARM64 release
    # Native aarch64 runner: no cross-toolchain or device sysroot needed. The
    # player is built against (and ships) its own FFmpeg 8.0 from
    # third_party/ffmpeg, so the container's FFmpeg does not matter.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config file \
            glslang-tools libvulkan-dev \
            libpulse-dev libfreetype-dev libsmbclient-dev libturbojpeg0-dev \
            libssh-dev libcurl4-openssl-dev libssl-dev \
            libdav1d-dev libgnutls28-dev zlib1g-dev curl xz-utils patch \
            libx11-dev libxrandr-dev libxxf86vm-dev libgl-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Check scripts
        run: |
          set -eux
          sh -n tools/install.sh
          bash -n tools/package-release.sh
          bash -n tools/build.sh

      # The player's own FFmpeg 8.0 (zero-copy dma-buf decode, AV1 via dav1d),
      # built against here and embedded into the player, which unpacks it at
      # start (src/app/bundled_ffmpeg.cpp).
      - name: Build patched FFmpeg
        run: JOBS="$(nproc)" bash third_party/ffmpeg/build.sh "$PWD/ffbuild"

      - name: Build
        env:
          PIXELVR_VERSION: ${{ inputs.tag || github.ref_name }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffbuild/prefix/lib/pkgconfig
        run: |
          set -eux
          bash tools/build.sh -DPIXELVR_EMBED_FFMPEG_DIR="$PWD/ffbuild/prefix"
          # The binary must want exactly the SONAMEs it ships.
          readelf -d build/bin/pixelvr | grep -E 'libav|libsw'
          readelf -d build/bin/pixelvr | grep -q 'libavcodec.so.62'

      - name: Release notes
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          # Hand-written notes for this version, if present; GitHub's generated
          # change list is appended below them.
          if [ -f "docs/release-notes/${tag}.md" ]; then
            cp "docs/release-notes/${tag}.md" release-notes.md
          else
            : > release-notes.md
          fi

      - name: Package
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          bash tools/package-release.sh build pixelvr-linux-arm64.tar.gz "${tag}"
          cp pixelvr-linux-arm64.tar.gz "pixelvr-linux-arm64-${tag}.tar.gz"
          sha256sum pixelvr-linux-arm64.tar.gz > pixelvr-linux-arm64.tar.gz.sha256
          sha256sum "pixelvr-linux-arm64-${tag}.tar.gz" > "pixelvr-linux-arm64-${tag}.tar.gz.sha256"

      # First-party plugins are separate downloads, never inside the player
      # package (docs/concepts/PLUGIN_SYSTEM_SPEC.md).
      - name: Package plugins
        run: |
          set -eux
          mkdir -p plugin-assets
          for p in funscript deovr-remote; do
            f=$(sh tools/package-plugin.sh "build/plugins/$p" plugin-assets)
            tar -tzf "$f" | grep -q "^$p/plugin.json$"
            file "build/plugins/$p/$p" | grep -q 'ARM aarch64'
          done
          (cd plugin-assets && sha256sum *.pvrplugin > plugins.sha256)
          ! tar -tzf pixelvr-linux-arm64.tar.gz | grep -q 'pvrplugin\|/plugins/'

      - name: Verify artifact
        run: |
          file build/bin/pixelvr
          file build/bin/pixelvr | grep -q 'ARM aarch64'
          # The browser-screen helper is built in (needs libturbojpeg).
          strings build/bin/pixelvr | grep -q -- '--pvr-browser'
          # The patched FFmpeg is embedded, and its sources ship (LGPL).
          nm build/bin/pixelvr | grep -q pvr_ffmpeg_avcodec_start
          tar -tzf pixelvr-linux-arm64.tar.gz | grep -q '/ffmpeg-source/dmabuf.patch$'
          tar -tzf pixelvr-linux-arm64.tar.gz | grep -q '^PixelVRPlayer/run.sh$'
          tar -tzf pixelvr-linux-arm64.tar.gz | grep -q '^PixelVRPlayer/install.sh$'
          tar -tzf pixelvr-linux-arm64.tar.gz | grep -q '^PixelVRPlayer/VERSION$'
          tar -tzf pixelvr-linux-arm64.tar.gz | grep -q '/shaders/thumb.frag.spv$'
          tar -tzf pixelvr-linux-arm64.tar.gz | grep -q '/fonts/Inter-Medium.ttf$'
          sha256sum -c pixelvr-linux-arm64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelvr-linux-arm64
          path: |
            pixelvr-linux-arm64.tar.gz
            pixelvr-linux-arm64.tar.gz.sha256
            pixelvr-linux-arm64-v*.tar.gz
            plugin-assets/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            pixelvr-linux-arm64.tar.gz
            pixelvr-linux-arm64.tar.gz.sha256
            pixelvr-linux-arm64-v*.tar.gz
            pixelvr-linux-arm64-v*.tar.gz.sha256
            plugin-assets/*.pvrplugin
            plugin-assets/plugins.sha256
